# ─────────────────────────────────────────────
#  Cylindrical Battery Design Automation & Review World
#  AI 에이전트가 설계 후보를 도출·점검·해석하고, 사람 검토자가 심의한다.
#  결정의 이유는 assignment/ 에 기록. 바꿀 때마다: npm run validate
# ─────────────────────────────────────────────

world:
  id: cylindrical-cell-design
  version: 0.1.0
  spec: superwork.world/v1
  mission: >
    목표 특성 달성, 설계가이드 충족(또는 책임자 예외 승인) 및 전기화학 해석이 검증되고,
    지정된 심의자의 검토를 거쳐 최종 채택 후보와 가이드 개정 여부가 확정된 원통형 전지 설계 시트를 확보한다.

entities:
  Sheet:
    attributes:
      id: string
      engineer: string                 # 시트 작성자 principal id
      reviewer: string                 # 설계 시작 시 지정되는 심의자 principal id
      # 목표 특성
      target_capacity: number
      target_energy: number
      target_porosity: number
      target_np_balance: number
      # 셀 치수
      height: number
      diameter: number
      l2_height: number
      top_cap: ref(MaterialPart)
      can: ref(MaterialPart)
      # Jelly roll
      anode_width: number
      cathode_width: number
      separator_width: number
      formula: string
      materials: string
      # 상세 설계값 (전극 값 loading/thickness/length는 CandidateCase로 일원화)
      electrolyte_type: string
      injection_amount: number
      injection_fraction: number
      # 루프 제어
      iteration_count: number
      max_iterations: number
      # 판단 플래그 ("yes" / "no")
      is_target_achievable: string
      is_guideline_satisfied: string
      is_product_allowed: string
      # 참조 및 책임자 (단일 출처)
      applied_guideline: ref(DesignGuideline)
      selected_candidate: ref(CandidateCase) # 최종 채택된 후보 참조
      waiver_approver: string                # 예외 승인한 책임자 ID
      # 기록용 텍스트
      electrochemical_analysis_report: string
      rework_reason: string
      abandon_reason: string
      proposed_guideline_revision: string
      status: state
    owned_state: true
  CandidateCase:
    attributes:
      id: string
      sheet: ref(Sheet)
      loading: number
      thickness: number
      length: number
  DesignGuideline:
    attributes:
      id: string
      criterion: string
  MaterialPart:
    attributes:
      id: string
      category: string
      spec: string

states:
  Sheet:
    - drafting
    - designing
    - rework_requested
    - under_review
    - revision_pending
    - approved
    - abandoned

terminal_states: [approved, abandoned]

transitions:
  submit_inputs:
    from: drafting
    to: designing
    principal_role: engineer
    guards: [C_author_submits, C_reviewer_assigned_and_distinct]
  rollback_to_spec:
    from: designing
    to: drafting
    principal_role: design_agent
    guards: [C_target_unachievable]
  re_design:
    from: designing
    to: designing
    principal_role: design_agent
    guards: [C_target_achievable, C_guideline_unsatisfied, C_within_iteration_limit]
  grant_waiver:
    from: designing
    to: designing
    principal_role: waiver_approver
    guards: [C_target_achievable, C_guideline_unsatisfied, C_waiver_approver_matches]
  fail_design:
    from: designing
    to: abandoned
    principal_role: reviewer
    guards: [C_no_self_review, C_designated_reviewer_only, C_guideline_unsatisfied, C_iterations_exhausted]
  request_review:
    from: designing
    to: under_review
    principal_role: analysis_agent
    guards: [C_target_achievable, C_guideline_or_product_allowed, C_require_analysis_report]
  request_rework:
    from: under_review
    to: rework_requested
    principal_role: reviewer
    guards: [C_no_self_review, C_designated_reviewer_only, C_require_rework_reason]
  complete_rework:
    from: rework_requested
    to: designing
    principal_role: design_agent
    guards: [C_within_iteration_limit]
  abandon:
    from: under_review
    to: abandoned
    principal_role: reviewer
    guards: [C_no_self_review, C_designated_reviewer_only, C_require_abandon_reason]
  approve:
    from: under_review
    to: approved
    principal_role: reviewer
    guards: [C_no_self_review, C_designated_reviewer_only, C_require_selected_candidate]
  approve_with_revision:
    from: under_review
    to: revision_pending
    principal_role: reviewer
    guards: [C_no_self_review, C_designated_reviewer_only, C_require_revision_proposal, C_require_selected_candidate]
  apply_guideline_revision:
    from: revision_pending
    to: approved
    principal_role: guideline_db_agent
    guards: [C_require_revision_proposal]

constraints:
  C_author_submits:
    expr: principal.id == sheet.engineer
    message: 시트에 기록된 작성자(engineer) 본인만 설계 입력을 제출할 수 있습니다.
  C_reviewer_assigned_and_distinct:
    expr: sheet.reviewer != "" and (sheet.reviewer != sheet.engineer or "team_lead" in principal.roles)
    message: 설계 시작 시 심의자(reviewer)를 반드시 지정해야 하며, 팀장(team_lead)을 제외한 작성자는 본인을 심의자로 지정할 수 없습니다.
  C_target_unachievable:
    expr: sheet.is_target_achievable == "no"
    message: 목표 특성 구현이 가능한 설계는 기본 사양으로 롤백할 수 없습니다.
  C_target_achievable:
    expr: sheet.is_target_achievable == "yes"
    message: 목표 특성을 구현할 수 없는 설계입니다. 셀 치수·Jelly roll·목표 특성 단계로 롤백하세요.
    on_fail_hint: rollback_to_spec
  C_guideline_unsatisfied:
    expr: sheet.is_guideline_satisfied == "no"
    message: 설계가이드를 이미 만족하는 설계는 재설계하거나 실패 종결할 수 없습니다.
    on_fail_hint: request_review
  C_within_iteration_limit:
    expr: sheet.iteration_count < sheet.max_iterations
    message: 최대 재설계 횟수에 도달했습니다. 더 이상 재설계할 수 없습니다.
    on_fail_hint: fail_design
  C_iterations_exhausted:
    expr: sheet.iteration_count >= sheet.max_iterations
    message: 재설계 횟수가 남아 있는 설계는 실패 종결할 수 없습니다.
    on_fail_hint: re_design
  C_waiver_approver_matches:
    expr: principal.id == sheet.waiver_approver and sheet.waiver_approver != ""
    message: 예외 승인(Waiver)은 시트에 기록된 책임자(waiver_approver) 본인만 수행할 수 있습니다.
  C_guideline_or_product_allowed:
    expr: sheet.is_guideline_satisfied == "yes" or (sheet.is_product_allowed == "yes" and sheet.waiver_approver != "")
    message: 설계가이드를 불만족하는 설계는 책임자의 사전 예외 승인(Waiver) 기록 없이는 심의에 상신할 수 없습니다.
    on_fail_hint: re_design
  C_require_analysis_report:
    expr: sheet.electrochemical_analysis_report != ""
    message: 전기화학 해석 보고서가 첨부되지 않은 설계는 심의에 상신할 수 없습니다.
  C_no_self_review:
    expr: principal.id != sheet.engineer or "team_lead" in principal.roles
    message: 팀장(team_lead)을 제외한 작성자는 자신의 시트를 심의(승인·재작업·폐기)할 수 없습니다.
  C_designated_reviewer_only:
    expr: principal.id == sheet.reviewer
    message: 시트에 지정된 심의자(reviewer)만 심의를 수행할 수 있습니다.
  C_require_selected_candidate:
    expr: sheet.selected_candidate != ""
    message: 최종 승인 시에는 심의를 통과한 1개의 채택 후보(selected_candidate)를 반드시 지정해야 합니다.
  C_require_rework_reason:
    expr: sheet.rework_reason != ""
    message: 재작업 지시에는 사유가 반드시 기록되어야 합니다.
  C_require_abandon_reason:
    expr: sheet.abandon_reason != ""
    message: 설계 폐기에는 사유가 반드시 기록되어야 합니다.
  C_require_revision_proposal:
    expr: sheet.proposed_guideline_revision != ""
    message: 검토자가 승인한 설계가이드 개정안 없이는 가이드를 개정할 수 없습니다.

principals:
  - id: eng-1
    name: Engineer 1
    roles: [engineer]
  - id: reviewer-1
    name: Reviewer 1 (person)
    roles: [reviewer]
  - id: eng-reviewer-1
    name: Engineer & Reviewer Dual Role
    roles: [engineer, reviewer]
  - id: team-lead-1
    name: Team Lead (person)
    roles: [engineer, reviewer, team_lead]
  - id: waiver-approver-1
    name: Safety & Product Lead (person)
    roles: [waiver_approver]
  - id: design-agent
    name: Design Agent
    roles: [design_agent]
  - id: analysis-agent
    name: Electrochemical Analysis Agent
    roles: [analysis_agent]
  - id: guideline-agent
    name: Guideline DB Agent
    roles: [guideline_db_agent]
